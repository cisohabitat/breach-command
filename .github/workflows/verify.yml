# The checks AGENTS.md requires before a commit, run on every push to main and
# every pull request. Vercel deploys main, so this is the gate in front of players.
name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Engine suite, balance, lint, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # pnpm-workspace.yaml keeps the store inside the checkout.
      - uses: actions/cache@v6
        with:
          path: .sites-runtime/pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Fixed seeds: the figures repeat exactly until a rule or content change
      # moves them, and a move of more than three points fails here by name.
      - name: Balance and repetition
        run: pnpm balance:check
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      - name: Whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  browser:
    name: Browser suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Restore only: the checks job writes this cache, and two jobs saving the
      # same key race for it.
      - uses: actions/cache/restore@v6
        with:
          path: .sites-runtime/pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm build
      # The suites run against the production build, which is what Vercel serves.
      - name: Accessibility, persistence, keyboard, responsive, visual and performance suites
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: |
          pnpm start -p 3000 > next-start.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -sf http://localhost:3000 > /dev/null && break
            sleep 1
          done
          pnpm test:e2e
      - name: Keep the failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            test-results/
            next-start.log
          retention-days: 14

  # WebKit (Safari's engine) and Firefox run the suites that exercise layout,
  # input, storage and the offline cache. A phone is a primary target, and iOS
  # browsers are all WebKit; before this job nothing ran outside Chromium.
  other-browsers:
    name: WebKit and Firefox
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/cache/restore@v6
        with:
          path: .sites-runtime/pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-firefox-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install WebKit and Firefox
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps webkit firefox
      - name: Install WebKit and Firefox system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps webkit firefox
      - run: pnpm build
      - name: Responsive, keyboard, persistence and offline suites
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_ALL_BROWSERS: "1"
        run: |
          pnpm start -p 3000 > next-start.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -sf http://localhost:3000 > /dev/null && break
            sleep 1
          done
          pnpm exec playwright test --project=webkit --project=firefox
      - name: Keep the failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-other-browsers
          path: |
            test-results/
            next-start.log
          retention-days: 14
