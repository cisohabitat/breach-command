# The checks AGENTS.md requires before a commit, run on every push to main and
# every pull request. Vercel deploys main, so this is the gate in front of players.
# Shared setup lives in .github/actions; the browser suites run against the
# production build through .github/scripts/with-production-server.sh.
name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Engine suite, balance, lint, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          save: "true"
      - run: pnpm security:audit
      - run: pnpm test
      # Fixed seeds: the figures repeat exactly until a rule or content change
      # moves them, and a move of more than three points fails here by name.
      - name: Balance and repetition
        run: pnpm balance:check
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      - name: Whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  browser:
    name: Browser suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/browsers
        with:
          browsers: chromium
          cache-key: playwright
      - run: pnpm build
      - name: Accessibility, persistence, keyboard, responsive, visual and performance suites
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: .github/scripts/with-production-server.sh pnpm test:e2e
      - name: Keep the failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-results
          path: |
            test-results/
            next-start.log
          retention-days: 14

  # WebKit (Safari's engine) and Firefox run the suites that exercise layout,
  # input, storage and the offline cache. A phone is a primary target, and iOS
  # browsers are all WebKit; before this job nothing ran outside Chromium.
  other-browsers:
    name: WebKit and Firefox
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/browsers
        with:
          browsers: webkit firefox
          cache-key: playwright-webkit-firefox
      - name: Start virtual audio output
        timeout-minutes: 5
        run: |
          sudo apt-get install --yes --no-install-recommends pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=breach-test
          pactl set-default-sink breach-test
      - run: pnpm build
      - name: Responsive, keyboard, persistence and offline suites
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_ALL_BROWSERS: "1"
        run: .github/scripts/with-production-server.sh pnpm exec playwright test --project=webkit --project=firefox
      - name: Keep the failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-results-other-browsers
          path: |
            test-results/
            next-start.log
          retention-days: 14
