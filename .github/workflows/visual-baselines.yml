# Visual baselines are recorded where they are checked. Text anti-aliasing on a
# GitHub runner differs from a developer's container by about one per cent of a
# phone screen's pixels, which is enough to fail a strict comparison. Run this by
# hand after a deliberate visual change: it records every baseline on a runner
# and pushes them to the ci/visual-baselines branch, to be reviewed image by
# image and brought into the change that caused them.
name: Record visual baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    name: Record visual baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/browsers
        with:
          browsers: chromium
          cache-key: playwright
          https-mirror: "false"
      - run: pnpm build
      - name: Record
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: .github/scripts/with-production-server.sh pnpm exec playwright test tests/e2e/visual.spec.ts --update-snapshots=all
      - name: Push to ci/visual-baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci/visual-baselines
          git add tests/e2e/visual.spec.ts-snapshots
          git commit -m "Record visual baselines on a runner from ${GITHUB_SHA::7}" || echo "No baseline changed"
          git push -f origin ci/visual-baselines
