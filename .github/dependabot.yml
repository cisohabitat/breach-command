# Next.js, React and Playwright tracked monthly, grouped so one pull request
# moves each family together; Verify's three browser engines are the gate.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Match pnpm's seven-day minimumReleaseAge before selecting a candidate.
    # Otherwise the updater pins a fresh release that pnpm correctly refuses.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      framework:
        patterns: ["next", "react", "react-dom", "@types/react", "@types/react-dom", "eslint-config-next"]
      playwright:
        patterns: ["@playwright/test", "playwright"]
  # The shared setup in .github/actions pins actions too, and the root entry
  # reads only .github/workflows.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: monthly
